[package]
name = "halyard"
version = "0.1.0-beta.1"
description = "A native desktop shell for the opencode coding agent"
authors = ["Halyard"]
edition = "2024"

# The `_lib` suffix keeps the lib name unique so it does not collide with the
# bin name. Required for mobile targets; harmless on desktop.
[lib]
name = "halyard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` is needed for the generated Windows taskbar overlay icon.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt", "macros"] }
tauri-plugin-fs = "2.7.0"
# Ships signed update artifacts and replaces the running app in place. Only
# AppImage (Linux) and NSIS (Windows) can self-update; `.deb` and `.msi` are
# published for people who update through a package manager.
tauri-plugin-updater = "2"

# Only the Unix shutdown path signals the child directly; Windows uses
# `taskkill` through the process handle. Building libc there would be dead weight.
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
tempfile = "3"
# Same verification stack the updater itself uses, so the test exercises the
# real algorithm rather than a lookalike. Both are dev-only: shipping them
# would put signing primitives in the binary for no reason.
minisign-verify = "0.2"
base64 = "0.22"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[package]
name = "halyard"
version = "0.1.0"
description = "A native desktop shell for the opencode coding agent"
authors = ["Halyard"]
edition = "2024"

# The `_lib` suffix keeps the lib name unique so it does not collide with the
# bin name. Required for mobile targets; harmless on desktop.
[lib]
name = "halyard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt", "macros"] }
libc = "0.2.190"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

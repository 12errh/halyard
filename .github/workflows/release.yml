name: Release

# A tag is the release trigger. `v1.2.3` and `v1.2.3-rc.1` both work; the
# leading `v` is stripped when comparing against the version in
# tauri.conf.json, so the two must not drift apart.
on:
  push:
    tags: ["v*"]
  # Manual run, for re-publishing a tag after a transient failure. Same inputs,
  # so it produces the same artifacts rather than a second, different build.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write # create the GitHub Release and upload assets

concurrency:
  # One release per tag. Never cancel: a cancelled build leaves the tag
  # pointing at a release with no artifacts.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The version in tauri.conf.json has to match the tag, or the updater will
  # publish a manifest announcing a version the app does not report itself as.
  verify:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      # Resolved here rather than read from `github.ref_name` downstream: on a
      # manual run the ref is the *branch*, and publishing to that would put
      # every artifact on a tag nobody cut a release for.
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Compare
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            git fetch --tags --force
            git checkout "$TAG"
          fi
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "tag=$TAG version=$VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run
      # Pure Python, no system dependencies. The Rust half of this check needs
      # Tauri's Linux libraries and lives in the linux job, which installs them.
      - name: Manifest script tests
        run: pnpm test:scripts
      # The artifacts the desktop builds package. Built once, uploaded, and
      # downloaded by both platform jobs, so Linux and Windows ship byte-equal
      # frontend code.
      - name: Build frontend
        # A gate, not a producer. Both platform jobs run `pnpm tauri build`,
        # which rebuilds the frontend itself, so nothing consumes this output;
        # it exists to fail the release on a broken frontend before either
        # platform burns ten minutes on a build that could not ship.
        run: pnpm vite build

  linux:
    name: Linux (AppImage + deb + rpm)
    needs: [verify, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `tauri build` runs `beforeBuildCommand`, which is `pnpm build`. So each
      # platform job does its own frontend build rather than consuming the one
      # the frontend job produced: the upstreaming of a prebuilt `dist` would
      # mean overriding `beforeBuildCommand`, and a release pipeline is the
      # wrong place to be clever about what gets bundled.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-linux

      - name: Verify the signing key before signing anything
        # Runs here rather than in the frontend job because this is the first
        # job with Tauri's system libraries. Every artifact below is signed with
        # that key, so discovering it was wrong after the build would waste the
        # whole run -- and a wrong key ships updates nobody can install.
        run: cargo test --manifest-path src-tauri/Cargo.toml --test updater_signing

      - name: Build bundles
        # `tauri build` signs the AppImage because it is the only Linux format
        # the updater can install over itself. `.deb` and `.rpm` are published
        # for people who update through the package manager, which has its own
        # trust chain and needs root to write /usr.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          BUNDLES=$(python3 scripts/bundle_targets.py "$VERSION" --platform linux)
          echo "::notice::$VERSION -> linux bundles: $BUNDLES"
          pnpm tauri build --bundles "$BUNDLES"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: src-tauri/target/release/bundle/
          retention-days: 1

  windows:
    name: Windows (NSIS + MSI)
    needs: [verify, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-windows

      - name: Build bundles
        # The bundle list is decided, not hardcoded: an MSI carries a
        # four-part numeric ProductVersion and cannot hold a semver
        # pre-release like `beta.1`, so prereleases ship NSIS alone. NSIS is
        # the format the updater installs over, so nothing operationally
        # useful is missing from a beta.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # `shell: bash` is explicit because the Windows runner defaults to
        # PowerShell, which does not understand `set -o pipefail` or `$()`.
        # Git Bash is present on windows-latest, and using one shell for both
        # platform jobs is worth more here than the runner's default.
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          BUNDLES=$(python3 scripts/bundle_targets.py "$VERSION" --platform windows)
          echo "::notice::$VERSION -> windows bundles: $BUNDLES"
          pnpm tauri build --bundles "$BUNDLES"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: src-tauri/target/release/bundle/
          retention-days: 1

  publish:
    name: Publish release
    # `verify` is a real dependency, not just a transitive one. Its outputs are
    # where the tag and version come from, and a job that does not declare a
    # `needs` gets an empty string for them rather than an error -- which is
    # how the first beta published `"version": ""` and a URL with `//` in it.
    needs: [verify, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: bundles/linux
      - uses: actions/download-artifact@v4
        with:
          name: windows-bundles
          path: bundles/windows

      - name: Assemble the update manifest
        # `tauri build` signs each artifact and writes no manifest, so this is
        # where `latest.json` is produced. Only the AppImage and the NSIS
        # installer go in: the updater's Linux path swaps the running executable
        # and Windows runs the installer, so a `.deb` listed here would be
        # downloaded and then fail. `.deb`, `.rpm` and `.msi` are still
        # published as release downloads.
        run: |
          set -euo pipefail
          python3 scripts/build_update_manifest.py bundles \
            --tag "${{ needs.verify.outputs.tag }}" \
            --version "${{ needs.verify.outputs.version }}" \
            --out latest.json

      - name: Verify the manifest names this version
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          python3 - "$VERSION" <<'PY'
          import json, sys
          expected = sys.argv[1]
          manifest = json.load(open("latest.json"))
          platforms = manifest["platforms"]
          found = {v["version"] for p in platforms.values() for v in p.values()}
          print("manifest platforms:", ", ".join(sorted(platforms)))
          print("manifest versions:", sorted(found))
          if found != {expected}:
              raise SystemExit(f"::error::manifest announces {found}, expected {{{expected}}}")
          if not platforms:
              raise SystemExit("::error::manifest lists no platforms")
          PY

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: Halyard ${{ needs.verify.outputs.version }}
          tag_name: ${{ needs.verify.outputs.tag }}
          # Draft on purpose. The updater endpoint serves
          # `/releases/latest/download/latest.json`, which does not resolve for
          # a draft, so publishing the draft is the switch that turns updates on
          # for everyone. It also means a half-built release is never visible.
          # Prereleases are marked as such on GitHub rather than shipped as a
          # plain release, so the tag list reads honestly and GitHub's
          # "latest release" semantics stay correct once 0.1.0 ships.
          prerelease: ${{ contains(needs.verify.outputs.tag, '-') }}
          generate_release_notes: true
          draft: true
          # Recursive on purpose. `download-artifact` preserves the structure
          # the artifact was uploaded with, and each platform uploads
          # `target/release/bundle/`, so the files arrive as
          # `bundles/linux/appimage/...`, one level below these paths. A
          # non-recursive glob matches nothing and silently uploads only
          # `latest.json` -- a release with no binaries, which is exactly what
          # the first beta produced.
          files: |
            latest.json
            bundles/linux/**/*.deb
            bundles/linux/**/*.rpm
            bundles/linux/**/*.AppImage
            bundles/linux/**/*.sig
            bundles/windows/**/*.exe
            bundles/windows/**/*.msi
            bundles/windows/**/*.sig

      - name: Verify the release carries what the manifest points at
        # A wrong glob does not fail: it matches nothing, and the release is
        # created with only `latest.json`. The first beta shipped exactly that
        # -- a green workflow and a release nobody could install. This checks
        # the published state rather than trusting the step above.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[].name' > /tmp/assets.txt
          echo "attached:"; sed 's/^/  /' /tmp/assets.txt

          python3 - <<'PY'
          import json, pathlib, sys, urllib.parse

          tag = __import__("os").environ["TAG"]
          assets = set(pathlib.Path("/tmp/assets.txt").read_text().split())
          manifest = json.load(open("latest.json"))

          missing_upload = []
          for platform, targets in manifest["platforms"].items():
              for target, entry in targets.items():
                  name = urllib.parse.unquote(urllib.parse.urlparse(entry["url"]).path.rsplit("/", 1)[-1])
                  if name not in assets:
                      missing_upload.append(f"{platform}/{target} -> {name}")

          if not manifest.get("version") or not manifest.get("version").strip():
              sys.exit("::error::manifest has an empty version")
          for platform, targets in manifest["platforms"].items():
              for target, entry in targets.items():
                  if f"/{tag}/" not in entry["url"]:
                      sys.exit(f"::error::{platform}/{target} url is not tagged {tag}: {entry['url']}")

          # Every updater-capable platform this release built must be present.
          if "linux-x86_64" not in manifest["platforms"]:
              sys.exit("::error::manifest has no linux entry; the AppImage is missing")

          if missing_upload:
              sys.exit("::error::manifest points at assets that were not uploaded:\n  " + "\n  ".join(missing_upload))

          print(f"manifest {manifest['version']} matches {len(assets)} uploaded assets")
          PY
